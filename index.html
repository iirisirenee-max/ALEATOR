<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALEATOR — Let chance choose what you learn</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
--bg:#F5F3ED;
--text:#111;
--muted:#666;
--primary:#C7FF00;
--secondary:#FF4FA3;
--card:#fff
}

*{
box-sizing:border-box;
margin:0;
padding:0
}

html{
scroll-behavior:smooth
}

body{
min-height:100vh;
background:var(--bg);
color:var(--text);
font-family:"DM Sans",sans-serif
}

.page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:35px 20px
}

.container{
width:min(900px,100%);
text-align:center
}

.logo{
font-family:"Space Grotesk",sans-serif;
font-size:clamp(65px,17vw,150px);
font-weight:700;
letter-spacing:-8px;
line-height:.8
}

.tagline{
margin-top:25px;
font-size:13px;
letter-spacing:5px;
font-weight:500;
color:var(--muted)
}

.divider{
width:120px;
height:4px;
background:var(--primary);
margin:55px auto 35px
}

.intro{
max-width:700px;
margin:auto;
font-family:"Space Grotesk",sans-serif;
font-size:clamp(28px,6vw,50px);
line-height:1.05;
font-weight:500;
letter-spacing:-2px
}

.intro em{
color:var(--secondary);
font-style:normal
}

.modes{
margin:40px auto 20px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap
}

.mode{
border:2px solid var(--text);
background:transparent;
color:var(--text);
padding:10px 20px;
border-radius:5px;
font:700 13px "DM Sans";
letter-spacing:1px;
cursor:pointer;
transition:.2s
}

.mode:hover{
transform:translateY(-2px)
}

.mode.active{
background:var(--text);
color:var(--primary)
}

.choose{
margin-top:30px;
width:min(400px,90vw);
min-height:72px;
border:3px solid var(--text);
border-radius:6px;
background:var(--primary);
color:var(--text);
font:700 20px "Space Grotesk";
letter-spacing:3px;
cursor:pointer;
box-shadow:7px 7px 0 var(--text);
transition:.2s
}

.choose:hover{
transform:translate(3px,3px);
box-shadow:4px 4px 0 var(--text)
}

.choose:active{
transform:translate(7px,7px);
box-shadow:none
}

.result{
margin:45px auto 0;
max-width:760px;
padding:40px 30px;
border:3px solid var(--text);
background:var(--card);
display:none;
box-shadow:9px 9px 0 var(--text);
animation:appear .35s ease
}

.result.show{
display:block
}

@keyframes appear{
from{
opacity:0;
transform:translateY(15px)
}
to{
opacity:1;
transform:translateY(0)
}
}

.result-label{
display:inline-block;
padding:7px 12px;
background:var(--secondary);
font-size:11px;
font-weight:700;
letter-spacing:2px
}

.topic{
margin-top:22px;
font-family:"Space Grotesk",sans-serif;
font-size:clamp(32px,7vw,58px);
line-height:1.05;
font-weight:600;
letter-spacing:-2px
}

.question{
margin:22px auto 0;
max-width:600px;
font-size:15px;
line-height:1.7;
color:var(--muted)
}

.search{
display:inline-block;
margin-top:28px;
padding:11px 20px;
border:2px solid var(--text);
background:var(--text);
color:white;
text-decoration:none;
font-size:12px;
font-weight:700;
letter-spacing:1px;
transition:.2s
}

.search:hover{
background:var(--primary);
color:var(--text)
}

.footer{
margin-top:55px;
font-size:12px;
letter-spacing:4px;
color:var(--muted)
}

@media(max-width:600px){
.logo{
letter-spacing:-5px
}

.tagline{
letter-spacing:3px
}

.divider{
margin-top:45px
}

.result{
padding:30px 20px
}

.choose{
margin-top:25px
}
}
</style>
</head>

<body>

<main class="page">

<div class="container">

<div class="logo">ALEATOR</div>

<div class="tagline">
LET CHANCE CHOOSE WHAT YOU LEARN
</div>

<div class="divider"></div>

<p class="intro">
You don't need to know<br>
<em>what to learn next.</em>
</p>

<div class="modes">

<button
class="mode active"
onclick="setMode('random',this)">
RANDOM
</button>

<button
class="mode"
onclick="setMode('deep',this)">
DEEP DIVE
</button>

<button
class="mode"
onclick="setMode('chaos',this)">
CHAOS
</button>

</div>

<button
class="choose"
onclick="chooseTopic()">
✦ CHOOSE FOR ME ✦
</button>

<div class="result" id="result">

<div class="result-label" id="label">
YOUR NEXT RABBIT HOLE
</div>

<div class="topic" id="topic">
—
</div>

<div class="question" id="question">
—
</div>

<a
class="search"
id="search"
href="#"
target="_blank">
SEARCH THIS TOPIC →
</a>

</div>

<div class="footer">
✦ &nbsp; FOLLOW THE RABBIT HOLE &nbsp; ✦
</div>

</div>

</main>

<script>

let currentMode="random";

function setMode(mode,button){

currentMode=mode;

document
.querySelectorAll(".mode")
.forEach(function(b){
b.classList.remove("active");
});

button.classList.add("active");

}

async function chooseTopic(){

const result=
document.getElementById("result");

const topic=
document.getElementById("topic");

const question=
document.getElementById("question");

const label=
document.getElementById("label");

const search=
document.getElementById("search");

result.classList.add("show");

topic.textContent=
"Following the trail...";

question.textContent=
"Finding something worth getting curious about...";

search.style.display="none";

label.textContent=
currentMode==="deep"
?"DEEP DIVE"
:
currentMode==="chaos"
?"CHAOS MODE"
:
"YOUR NEXT RABBIT HOLE";

try{

const response=
await fetch(
"/api/topic?mode="+
encodeURIComponent(currentMode)
);

const data=
await response.json();

if(!response.ok)
throw new Error(
data.error||"API error"
);

topic.textContent=data.topic;

question.textContent=
currentMode==="deep"
?
"Don't just find the answer. Follow the evidence deeper."
:
currentMode==="chaos"
?
"You probably weren't expecting this. That's exactly the point."
:
"You weren't looking for this. That's exactly the point.";

search.href=
"https://www.google.com/search?q="+
encodeURIComponent(data.topic);

search.style.display=
"inline-block";

}
catch(error){

topic.textContent=
"The rabbit disappeared.";

question.textContent=
"Something went wrong. Try again.";

}

}

</script>

</body>
</html>

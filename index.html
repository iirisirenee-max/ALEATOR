<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEATOR — Let chance choose what you learn</title>
  <style>
    :root {
      --bg: #F4F3EF;
      --text: #111111;
      --primary: #CCFF00;
      --accent: #FF3366;
      --border: #111111;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
    h1 { font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; }
    .subtitle { color: var(--accent); font-weight: bold; margin-top: 5px; }
    
    .modes { display: flex; gap: 10px; margin-bottom: 25px; }
    .mode-btn { background: white; border: 2px solid var(--border); padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; box-shadow: 3px 3px 0 var(--border); transition: 0.1s; }
    .mode-btn.active { background: var(--text); color: white; transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--border); }
    
    .cta-btn { background: var(--primary); border: 2px solid var(--border); width: 100%; max-width: 450px; padding: 15px; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 8px; box-shadow: 4px 4px 0 var(--border); margin-bottom: 30px; transition: 0.1s; }
    .cta-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--border); }
    
    .card { background: white; border: 3px solid var(--border); width: 100%; max-width: 450px; padding: 25px; border-radius: 4px; box-shadow: 6px 6px 0 var(--border); display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    .card-tag { background: var(--accent); color: white; font-size: 0.8rem; font-weight: bold; padding: 4px 8px; align-self: flex-start; text-transform: uppercase; letter-spacing: 1px; }
    .meta-chips { display: flex; gap: 10px; font-size: 0.8rem; font-weight: bold; color: #666; }
    .title-display { font-size: 1.8rem; font-weight: 800; line-height: 1.2; }
    .hook-display { font-style: italic; color: #444; border-left: 3px solid var(--primary); padding-left: 10px; line-height: 1.4; }
    .facts-list { padding-left: 20px; margin: 5px 0; font-size: 0.95rem; line-height: 1.5; }
    .facts-list li { margin-bottom: 8px; }
    .sources-display { font-size: 0.8rem; color: #777; border-top: 1px solid #eee; padding-top: 10px; }
    
    /* NEW ADDICTIVE LOOP ELEMENTS */
    .loop-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; border-top: 2px dashed var(--border); padding-top: 15px; }
    .loop-btn { background: var(--primary); border: 2px solid var(--border); font-weight: 900; padding: 12px; font-size: 1rem; text-transform: uppercase; cursor: pointer; text-align: center; box-shadow: 3px 3px 0 var(--border); width: 100%; }
    .loop-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--border); }
    
    .history-box { width: 100%; max-width: 450px; border: 2px dashed #999; padding: 15px; border-radius: 4px; background: rgba(255,255,255,0.5); }
    .history-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; color: #555; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .history-list { list-style: none; font-size: 0.9rem; }
    .history-item { padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.05); color: #444; }
  </style>
</head>
<body>

  <header>
    <h1>Aleator</h1>
    <div class="subtitle">Let chance choose what you learn.</div>
  </header>

  <div class="modes">
    <button class="mode-btn active" onclick="setMode('random', this)">Random</button>
    <button class="mode-btn" onclick="setMode('deep', this)">Deep Dive</button>
    <button class="mode-btn" onclick="setMode('chaos', this)">Chaos</button>
  </div>

  <button class="cta-btn" id="triggerBtn" onclick="fetchRabbitHole()">✦ Choose For Me ✦</button>

  <div class="card" id="displayCard">
    <div class="card-tag">Your Next Rabbit Hole</div>
    <div id="cardContent">
      <div class="title-display" style="text-align:center; color:#888; font-weight:500; margin: 20px 0;">—</div>
    </div>
  </div>

  <!-- NEW HISTORY WORKSPACE -->
  <div class="history-box" id="historyBox" style="display: none;">
    <div class="history-title">
      <span>📜 Recently Explored</span>
      <span id="discoveryCount">0 Discoveries</span>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </div>

  <script>
    let currentMode = 'random';
    let historyStack = JSON.parse(localStorage.getItem('aleator_history')) || [];

    // Run on startup to load past saves
    updateHistoryUI();

    function setMode(mode, element) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    async function fetchRabbitHole() {
      const btn = document.getElementById('triggerBtn');
      const container = document.getElementById('cardContent');
      
      btn.disabled = true;
      container.innerHTML = `<div class="title-display" style="text-align:center; color:#555; font-size:1.2rem; margin:20px 0;">Consulting the void...</div>`;

      try {
        const response = await fetch(`/api/topic?mode=${currentMode}`);
        if (!response.ok) throw new Error('Failed to load payload');
        
        const data = await response.json();
        
        // Log to browser history setup
        saveToHistory(data.title);

        // Get alternate context macro text for loops
        const alternatePrompts = ["Give me something stranger →", "Take me somewhere unexpected →", "One more rabbit hole →", "Abandon context again →"];
        const randomPromptText = alternatePrompts[Math.floor(Math.random() * alternatePrompts.length)];
        
        container.innerHTML = `
          <div class="meta-chips">
            <span>⏱ ${data.readTime || '3 min read'}</span>
            <span>•</span>
            <span>📊 ${data.depth || 'Quick Curiosity'}</span>
          </div>
          <h2 class="title-display" style="margin-top: 5px; margin-bottom: 10px;">${data.title}</h2>
          <p class="hook-display">${data.hook}</p>
          <p style="font-size:0.95rem; line-height:1.4; margin: 10px 0;">${data.explanation}</p>
          <strong style="font-size:0.9rem; text-transform:uppercase; letter-spacing:0.5px;">What you'll discover:</strong>
          <ul class="facts-list">
            ${data.keyFacts.map(fact => `<li>${fact}</li>`).join('')}
          </ul>
          <div class="sources-display" style="margin-bottom:10px;">
            <strong>Verified from:</strong> ${data.sources ? data.sources.join(', ') : 'Open Source Research'}
          </div>

          <!-- THE ADDICTIVE CONTINUITY LOOP -->
          <div class="loop-actions">
            <button class="loop-btn" onclick="fetchRabbitHole()">${randomPromptText}</button>
          </div>
        `;
      } catch (error) {
        container.innerHTML = `
          <h2 class="title-display" style="margin-bottom:10px; color: var(--accent);">The rabbit disappeared.</h2>
          <p style="color:#555;">Something went wrong. Let's try parsing the trail again.</p>
        `;
      } finally {
        btn.disabled = false;
      }
    }

    function saveToHistory(title) {
      // Don't add consecutive duplicates
      if (historyStack[0] !== title) {
        historyStack.unshift(title);
        if (historyStack.length > 5) historyStack.pop(); // Keep top 5 items
        localStorage.setItem('aleator_history', JSON.stringify(historyStack));
        updateHistoryUI();
      }
    }

    function updateHistoryUI() {
      const box = document.getElementById('historyBox');
      const list = document.getElementById('historyList');
      const countLabel = document.getElementById('discoveryCount');
      
      if (historyStack.length === 0) {
        box.style.display = 'none';
        return;
      }
      
      box.style.display = 'block';
      countLabel.innerText = `${historyStack.length} Discoveries`;
      list.innerHTML = historyStack.map(item => `<li class="history-item">• ${item}</li>`).join('');
    }
  </script>
</body>
</html>
